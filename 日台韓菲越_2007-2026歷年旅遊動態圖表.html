    <style>

    <script src="https://code.highcharts.com/highcharts.js"></script>

      </p>

    <script>
// Plugin to add text animation to data labels (支援小數點後一位動畫)
(Highcharts => {
    const { charts, Fx, Series, SVGElement, wrap } = Highcharts;
    const FLOAT = /^-?\d+\.?\d*$/;

    Fx.prototype.textSetter = function() {
        const chart = charts[this.elem.renderer.chartIndex];
        let thousandsSep = chart.numberFormatter(1000.0, 1)[1];

        if (/[0-9]/.test(thousandsSep)) {
            thousandsSep = ',';
        }

        const replaceRegEx = new RegExp('\\' + thousandsSep, 'g');

        let startValue = String(this.start || '').replace(replaceRegEx, ''),
            endValue = String(this.end || '').replace(replaceRegEx, ''),
            currentValue = String(this.end || '').replace(replaceRegEx, '');

        if (startValue.match(FLOAT) && endValue.match(FLOAT)) {
            const sNum = parseFloat(startValue);
            const eNum = parseFloat(endValue);
            const interpolated = sNum + (eNum - sNum) * this.pos;

            currentValue = chart.numberFormatter(interpolated, 1);
        }

        this.elem.endText = this.end;
        this.elem.attr(this.prop, currentValue, null, true);
    };

    SVGElement.prototype.textGetter = function() {
        const ct = this.text.element.textContent || '';
        return this.endText ? this.endText : ct.substring(0, ct.length / 2);
    };

    wrap(Series.prototype, 'drawDataLabels', function(proceed, ...args) {
        const attr = SVGElement.prototype.attr,
            chart = this.chart;

        if (chart.sequenceTimer) {
            this.points.forEach(point =>
                (point.dataLabels || []).forEach(
                    label =>
                        (label.attr = function(...labelArgs) {
                            const [hash, ...rest] = labelArgs;

                            if (
                                typeof hash === 'object' &&
                                hash.text !== undefined &&
                                chart.isResizing === 0
                            ) {
                                const text = hash.text;
                                delete hash.text;

                                return this.attr(hash, ...rest).animate({
                                    text
                                });
                            }
                            return attr.apply(this, labelArgs);
                        })
                )
            );
        }

        const ret = proceed.apply(this, args);

        this.points.forEach(p =>
            (p.dataLabels || []).forEach(d => (d.attr = attr))
        );

        return ret;
    });
})(Highcharts);

const startYear = 2007,
    endYear = 2026,
    btn = document.getElementById('play-pause-button'),
    input = document.getElementById('play-range'),
    yearBadge = document.getElementById('current-year-badge'),
    noteBanner = document.getElementById('year-note-banner'),
    nbr = 5;

// 固定各國代表色，避免排名變動時顏色跳動
const countryColors = {

// 來自 Excel「歷年數據(萬人次)」之完整資料

// 來自 Excel「關鍵事件與旅遊趨勢備註」
const yearNotes = {
    "2007": "金融海嘯前基準年",
    "2008": "全球金融海嘯爆發",
    "2009": "H1N1與金融海嘯影響，台韓逆勢成長",
    "2010": "亞太旅遊全面回溫",

    "2026": "進行中年度：日(1-10月推估約3,350萬)、台(1-9月617.7萬)、韓(11月中破2,000萬)、菲(11月初逾500萬)、越(1-10月推估約1,780萬)"
};

let chart;

function getData(year) {
    const yrKey = String(year);
    const list = Object.keys(dataset)
        .map(countryName => ({
            name: countryName,
            y: Number(dataset[countryName][yrKey]),
            color: countryColors[countryName]
        }))
        .sort((a, b) => b.y - a.y);

    const total = list.reduce((sum, item) => sum + item.y, 0);
    return {
        total: total,
        items: list.slice(0, nbr)
    };
}

function getSubtitle() {
    const currentYear = Number(input.value);
    const { total } = getData(currentYear);
    const yearLabel = currentYear === 2026 ? '2026*' : String(currentYear);
    return `<span style="font-size: 68px; font-weight: 700; color: #1B4332;">${yearLabel}</span>
        <br>
        <span style="font-size: 20px; color: #495057;">
            五地合計：<b>${total.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</b> 萬人次
        </span>`;
}

function updateUIAnnotations(year) {
    const yrStr = String(year);
    if (yearBadge) {
        yearBadge.textContent = year === 2026 ? '2026 (累計)' : yrStr;
    }
    if (noteBanner && yearNotes[yrStr]) {
        noteBanner.textContent = `📌 ${yrStr} 關鍵趨勢：${yearNotes[yrStr]}`;
    }
}

const linearEasing = function(pos) {
    return pos;
};

(() => {
    updateUIAnnotations(startYear);

    chart = Highcharts.chart('container', {
        chart: {
            animation: {
                duration: 600,
                easing: linearEasing
            },
            marginRight: 90
        },
        title: {
            text: '日、台、韓、菲、越 國際入境旅客歷年排名 (2007–2026)',
            align: 'left'
        },
        subtitle: {
            text: getSubtitle(),
            floating: true,
            align: 'right',
            verticalAlign: 'bottom',
            useHTML: true,
            y: -35,
            x: -20
        },
        legend: {
            enabled: false
        },
        xAxis: {
            type: 'category',
            labels: {
                style: {
                    fontSize: '15px',
                    fontWeight: 'bold'
                }
            }
        },
        yAxis: {
            opposite: true,
            tickPixelInterval: 150,
            max: 4600,
            title: {
                text: '入境旅客數（萬人次）'
            }
        },
        tooltip: {
            valueDecimals: 1,
            valueSuffix: ' 萬人次'
        },
        plotOptions: {
            bar: {
                animation: false,
                groupPadding: 0.08,
                pointPadding: 0.12,
                borderWidth: 0,
                borderRadius: 4,
                dataSorting: {
                    enabled: true,
                    matchByName: true
                },
                dataLabels: {
                    enabled: true,
                    format: '{point.y:,.1f} 萬',
                    style: {
                        fontSize: '13px',
                        fontWeight: 'bold'
                    }
                }
            }
        },
        series: [
            {
                type: 'bar',
                name: String(startYear),
                data: getData(startYear).items
            }
        ],
        responsive: {
            rules: [
                {
                    condition: {
                        maxWidth: 550
                    },
                    chartOptions: {
                        xAxis: {
                            visible: false
                        },
                        subtitle: {
                            x: 0
                        },
                        plotOptions: {
                            series: {
                                dataLabels: [
                                    {
                                        enabled: true,
                                        format: '{point.y:,.1f} 萬',
                                        y: 8
                                    },
                                    {
                                        enabled: true,
                                        format: '{point.name}',
                                        y: -8,
                                        style: {
                                            fontWeight: 'normal',
                                            opacity: 0.7
                                        }
                                    }
                                ]
                            }
                        }
                    }
                }
            ]
        }
    });
})();

function pause(button) {
    button.title = '播放';
    button.className = 'fa fa-play';
    clearInterval(chart.sequenceTimer);
    chart.sequenceTimer = undefined;
}

function update(increment) {
    if (increment) {
        input.value = String(parseInt(input.value, 10) + increment);
    }
    const currentYear = Number(input.value);
    if (currentYear >= endYear) {
        pause(btn);
    }

    updateUIAnnotations(currentYear);

    chart.setTitle(
        void 0,
        {
            text: getSubtitle()
        },
        false
    );

    chart.series[0].update({
        type: 'bar',
        name: String(currentYear),
        data: getData(currentYear).items
    });
}

function play(button) {
    if (Number(input.value) >= endYear) {
        input.value = String(startYear);
        update(0);
    }
    button.title = '暫停';
    button.className = 'fa fa-pause';
    chart.sequenceTimer = setInterval(function() {
        update(1);
    }, 800);
}

btn.addEventListener('click', function() {
    if (chart.sequenceTimer) {
        pause(this);
    } else {
        play(this);
    }
});

input.addEventListener('input', function() {
    if (chart.sequenceTimer) {
        pause(btn);
    }
    update(0);
});

    </script>
